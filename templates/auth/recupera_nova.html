{% extends "base.html" %}
{% block titol %}Contrasenya nova{% endblock %}
{% block css_extra %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block contingut %}
<div class="entrada">
  <h1>Posa una contrasenya nova</h1>
  <form method="post" class="targeta">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="camp">
      <label for="nova">Contrasenya nova</label>
      <input id="nova" name="nova" type="password" autocomplete="new-password"
             autofocus required minlength="10">
    </p>
    <p class="camp">
      <label for="repeticio">Torna a escriure-la</label>
      <input id="repeticio" name="repeticio" type="password"
             autocomplete="new-password" required minlength="10">
    </p>
    <p class="accions"><button class="btn" type="submit">Desa-la</button></p>
  </form>
</div>
{% endblock %}
