{% extends "base.html" %}
{% block titol %}Canvia la contrasenya{% endblock %}
{% block contingut %}
<div class="targeta">
  <h1>Canvia la contrasenya</h1>
  <p class="subtitol">Com a mínim 10 caràcters. Tria'n una que no facis servir
     enlloc més.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="camp">
      <label for="actual">Contrasenya actual</label>
      <input id="actual" name="actual" type="password"
             autocomplete="current-password" required>
    </p>
    <p class="camp">
      <label for="nova">Contrasenya nova</label>
      <input id="nova" name="nova" type="password" autocomplete="new-password"
             required minlength="10">
    </p>
    <p class="camp">
      <label for="repeticio">Torna a escriure-la</label>
      <input id="repeticio" name="repeticio" type="password"
             autocomplete="new-password" required minlength="10">
    </p>
    <p class="accions"><button class="btn" type="submit">Canvia-la</button></p>
  </form>
</div>
{% endblock %}
